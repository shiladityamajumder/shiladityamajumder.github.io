<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Page not found — Shiladitya Majumder</title>
  <style>
    :root{--page:#fff;--surface:#f7f7f4;--ink:#111;--muted:#5e5e59;--line:#d9d9d3;--inverse:#fff;color-scheme:light}
    html[data-theme="dark"]{--page:#0b0b0b;--surface:#151515;--ink:#f4f4ef;--muted:#b8b8b1;--line:#30302d;--inverse:#111;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--page);color:var(--ink);font-family:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    .card{width:min(52rem,100%);padding:clamp(2rem,7vw,5rem);border:1px solid var(--ink);background:var(--surface);box-shadow:0 24px 70px rgba(17,17,17,.09)}
    .mark{width:3rem;aspect-ratio:1;display:grid;place-items:center;border-radius:.85rem;background:var(--ink);color:var(--inverse)}
    .mark svg{width:2rem;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    .code{margin:2.5rem 0 0;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    h1{max-width:10ch;margin:1rem 0 1.5rem;font-size:clamp(3rem,9vw,6.6rem);font-weight:500;letter-spacing:-.06em;line-height:.96;text-wrap:balance}
    p{max-width:34rem;color:var(--muted);line-height:1.75;text-wrap:pretty}
    a{display:inline-flex;margin-top:1.2rem;padding:.75rem 1rem;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--inverse);font-size:.82rem;font-weight:700;text-decoration:none}
    a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  </style>
  <script>
    try{if(localStorage.getItem('portfolio-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}
  </script>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M15 11 8.5 20 15 29"></path><path d="m25 11 6.5 9-6.5 9"></path><path d="m23 8-6 24"></path></svg>
    </div>
    <p class="code">Error 404 / Route unavailable</p>
    <h1>This page could not be found.</h1>
    <p>The address may be incorrect or the page may have moved. Return to the main portfolio to continue.</p>
    <a href="/">Return to portfolio</a>
  </main>
</body>
</html>
