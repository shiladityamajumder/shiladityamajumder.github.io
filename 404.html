<!doctype html>
<html lang="en" data-theme="palette">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#dcedc1">
  <title>Page not found — Shiladitya Majumder</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try {
      const savedTheme = localStorage.getItem('portfolio-theme');
      const theme = savedTheme === 'mono' ? 'mono' : 'palette';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme === 'mono' ? 'dark' : 'light';
    } catch (_) {}
  </script>
</head>
<body>
  <main class="not-found-page">
    <div class="not-found-card">
      <div class="not-found-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <path d="M15 11 8.5 20 15 29"></path>
          <path d="m25 11 6.5 9-6.5 9"></path>
          <path d="m23 8-6 24"></path>
        </svg>
      </div>
      <p class="not-found-code">Error 404 / Route unavailable</p>
      <h1>This page could not be found.</h1>
      <p>The address may be incorrect or the page may have moved. Return to the main portfolio to continue.</p>
      <a href="/">Return to portfolio</a>
    </div>
  </main>
</body>
</html>
